name: chat_package
description: >-
  A fully functional, customizable Flutter chat UI for sending text, voice
  notes, images, in-app camera photos and video messages.
version: 2.1.0
homepage: https://github.com/MOUKZ/chat_package
repository: https://github.com/MOUKZ/chat_package
issue_tracker: https://github.com/MOUKZ/chat_package/issues

topics:
  - chat
  - chat-ui
  - voice-message
  - camera
  - messaging

screenshots:
  - description: Chat home screen
    path: screenShots/home_screen.png
  - description: Recording a voice note
    path: screenShots/recording.png
  - description: Attachment bottom sheet
    path: screenShots/bottom_sheet.png
  - description: Permission request
    path: screenShots/permission.png

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.3
  path_provider: ^2.1.4
  image_picker: ^1.2.2
  just_audio: ^0.10.5
  record: ^7.1.0
  intl: ^0.20.2
  photo_view: ^0.15.0
  stop_watch_timer: ^3.2.2
  provider: ^6.0.4
  camera: ^0.12.0+1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
